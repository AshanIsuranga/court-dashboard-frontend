<div
  class="flex flex-row justify-between items-center w-full px-6 md:px-8"
  style="background: linear-gradient(90deg, #0F2547 0%, #1A3A6B 100%); border-bottom: 2px solid #C9A84C; min-height: 60px; box-shadow: 0 2px 16px rgba(15,37,71,0.35);"
>
  <!-- Left: court branding -->
  <div class="flex items-center gap-3">
    <div
      class="flex items-center justify-center rounded-full flex-shrink-0"
      style="width:36px; height:36px; background: rgba(201,168,76,0.15); border: 1.5px solid #C9A84C;"
    >
      <i class="fa-solid fa-scale-balanced text-sm" style="color:#C9A84C;"></i>
    </div>
    <div class="hidden sm:block leading-tight">
      <p class="text-[10px] font-semibold tracking-widest uppercase" style="color:#C9A84C; letter-spacing:0.12em;">Republic of Sri Lanka</p>
      <p class="text-sm font-bold text-white">Judicial Information System</p>
    </div>
  </div>

  <!-- Right: actions -->
  <div class="flex items-center gap-1">

    <!-- Notification Bell -->
    <button
      class="relative flex items-center justify-center rounded-lg transition-colors w-9 h-9"
      style="color: rgba(255,255,255,0.75);"
      onmouseover="this.style.background='rgba(255,255,255,0.1)'"
      onmouseout="this.style.background='transparent'"
      title="Notifications"
    >
      <i class="fa-solid fa-bell text-base"></i>
      <span
        class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full"
        style="background:#C9A84C;"
      ></span>
    </button>

    <!-- Divider -->
    <div class="w-px h-6 mx-2" style="background: rgba(201,168,76,0.3);"></div>

    <!-- Profile -->
    <button
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg transition-colors"
      style="color: rgba(255,255,255,0.85);"
      onmouseover="this.style.background='rgba(255,255,255,0.1)'"
      onmouseout="this.style.background='transparent'"
      (click)="navigate('/profile')"
      title="My Profile"
    >
      <div *ngIf="!userImage"
        class="flex items-center justify-center rounded-full flex-shrink-0"
        style="width:30px; height:30px; background: rgba(201,168,76,0.15); border: 1.5px solid #C9A84C;"
      >
        <i class="fa-solid fa-user text-xs" style="color:#C9A84C;"></i>
      </div>
      <img
        *ngIf="userImage"
        [src]="userImage"
        class="rounded-full object-cover flex-shrink-0"
        style="width:30px; height:30px; border: 1.5px solid #C9A84C;"
      />
      <span class="text-sm font-medium hidden md:block text-white">My Profile</span>
    </button>

    <!-- Logout -->
    <button
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg transition-colors ml-1"
      style="border: 1.5px solid rgba(201,168,76,0.45); color:#C9A84C;"
      onmouseover="this.style.background='rgba(201,168,76,0.12)'"
      onmouseout="this.style.background='transparent'"
      (click)="logOut()"
      title="Logout"
    >
      <i class="fas fa-sign-out-alt text-sm"></i>
      <span class="text-sm font-medium hidden sm:block">Logout</span>
    </button>
  </div>
</div>

<!-- Logout Confirmation Modal -->
<div *ngIf="logOutView" class="fixed inset-0 flex items-center justify-center z-50" style="background: rgba(15,37,71,0.7);">
  <div class="rounded-xl px-8 py-10 w-full max-w-sm shadow-2xl" style="background:#fff; border-top: 4px solid #C9A84C;">

    <div class="flex flex-col items-center mb-6">
      <div
        class="flex items-center justify-center rounded-full mb-4"
        style="width:64px; height:64px; background: rgba(201,168,76,0.12); border: 2px solid #C9A84C;"
      >
        <i class="fa-solid fa-triangle-exclamation text-3xl" style="color:#C9A84C;"></i>
      </div>
      <h3 class="text-lg font-bold mb-1" style="color:#0F2547;">Confirm Logout</h3>
      <p class="text-sm text-gray-500 text-center">Are you sure you want to log out of the Judicial System?</p>
    </div>

    <div class="flex justify-center gap-4">
      <button
        class="flex-1 py-2.5 rounded-lg font-semibold text-sm transition-colors border-2"
        style="border-color:#0F2547; color:#0F2547; background:#fff;"
        (click)="confirmLogOut()"
      >
        Yes, Logout
      </button>
      <button
        class="flex-1 py-2.5 rounded-lg font-bold text-sm text-white transition-colors"
        style="background:#0F2547; border: 2px solid #C9A84C;"
        (click)="cancelLogOut()"
      >
        Stay on Page
      </button>
    </div>
  </div>
</div>
