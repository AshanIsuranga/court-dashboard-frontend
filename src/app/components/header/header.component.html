<div
  class="flex flex-row justify-end items-center w-full bg-white dark:bg-[#1D1D1F] shadow-lg py-1.5 px-4 sm:px-6 md:px-8 lg:px-10"
  style="box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1)"
>
  <i
    class="fa-solid fa-bell text-xl sm:text-2xl text-gray-500 mx-4 sm:mx-6 md:mx-8 lg:mx-10 cursor-pointer"
  ></i>

  <i *ngIf="!userImage"
    class="fa-solid fa-user text-lg sm:text-xl dark:text-textDark cursor-pointer"
    (click)="navigate('/profile')"
  ></i>

  <img
    *ngIf="userImage"
    [src]="userImage"
    class="w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer object-cover"
    (click)="navigate('/profile')"
  />

  <!-- Logout Button -->
  <button
    class="flex items-center gap-2 ml-6 text-red-500 hover:bg-[#EDF5FC] dark:hover:bg-[#272F45] rounded-lg px-3 py-2 transition-colors"
    (click)="logOut()"
  >
    <i class="fas fa-sign-out-alt text-lg"></i>
    <span class="text-sm font-medium hidden sm:block">Logout</span>
  </button>
</div>

<!-- Logout Confirmation Modal -->
<div *ngIf="logOutView" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-[#363636] shadow-lg rounded-lg px-6 py-10 w-1/3">
    <div>
      <div class="flex items-center justify-center bg-[#F6F7F9] rounded-lg shadow-sm px-4 mb-3 py-3 mx-auto w-[70px]">
        <i class="fa-solid fa-triangle-exclamation text-[#6B7D8C] text-4xl px-1"></i>
      </div>

      <div class="mb-8 text-center dark:text-textDark">
        <p class="text-lg mb-2">Are you sure you want to Logout?</p>
      </div>

      <div class="flex justify-center gap-6">
        <button
          class="bg-[#E8E8E8] border-[1px] border-[#6B7D8C] px-10 py-0.35 rounded-lg shadow-md"
          (click)="confirmLogOut()"
        >
          <span class="font-semibold text-[#6B7D8C]">Yes,</span><br />
          <span class="text-light button-text text-[#6B7D8C]">Logout</span>
        </button>
        <button
          class="bg-[#415CFF] border-[1px] border-[#415CFF] px-10 py-0.35 rounded-lg shadow-md"
          (click)="cancelLogOut()"
        >
          <span class="font-semibold text-white">Stay</span><br />
          <span class="text-light button-text text-white">On Page</span>
        </button>
      </div>
    </div>
  </div>
</div>
